name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup mise
        uses: jdx/mise-action@v4.2.3
        with:
          install: true
          cache: true

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Set pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm build

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # GITHUB_TOKENによるpushは他のワークフローをトリガーしないため、
      # mainへのpushで動かす別ワークフローではなく、マージ前のこのジョブ内で更新する。
      - name: Update biome.json schema version
        if: contains(steps.metadata.outputs.dependency-names, '@biomejs/biome')
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@biomejs/biome']")
          sed -i "s|https://biomejs.dev/schemas/[^/]*/schema.json|https://biomejs.dev/schemas/${VERSION}/schema.json|" biome.json

          git diff --quiet -- biome.json && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biome.json
          git commit -m "chore: update biome.json schema to v${VERSION}"
          git push origin "HEAD:${PR_HEAD_REF}"
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
