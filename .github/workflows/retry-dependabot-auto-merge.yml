name: Retry Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Dependabot auto-merge
    types:
      - completed

permissions:
  actions: write
  pull-requests: read

jobs:
  retry:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4
    steps:
      - name: Random delay before retry
        run: |
          delay=$((RANDOM % 181 + 120))
          echo "Waiting ${delay} seconds before retry..."
          sleep $delay

      - name: Retry failed workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 待機中にPRがマージ・クローズされるとブランチが削除され、再実行してもcheckoutで失敗するため、オープンなPRがある場合のみ再実行する
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open',
            });
            if (pulls.length === 0) {
              core.info('No open PR for this branch; skipping retry.');
              return;
            }
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
